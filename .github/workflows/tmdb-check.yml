name: TMDB check

# Setup proof and research: confirms the TMDB_TOKEN secret works, prints EVERY US
# streaming provider TMDB knows (id, name, display priority), and then how many
# titles each of the 150 highest-priority providers carries on a subscription
# or free-with-ads basis. Used to decide which services the app offers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List all US providers
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "TMDB_TOKEN secret is missing"; exit 1
          fi
          for kind in movie tv; do
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $TMDB_TOKEN" -H "Accept: application/json" \
              "https://api.themoviedb.org/3/watch/providers/$kind?watch_region=US&language=en-US" > "$kind.json"
          done
          echo "== ALL US providers: id, name, display priority (movie list / tv list) =="
          jq -rs '
            [ .[0].results[] | {id: .provider_id, name: .provider_name, m: (.display_priorities.US // .display_priority)} ] as $m
            | [ .[1].results[] | {id: .provider_id, name: .provider_name, t: (.display_priorities.US // .display_priority)} ] as $t
            | ( ($m | map({key: (.id|tostring), value: .}) | from_entries) ) as $mm
            | ( ($t | map({key: (.id|tostring), value: .}) | from_entries) ) as $tt
            | ([ $m[].id, $t[].id ] | unique) [] as $id
            | [ $id, ($mm[$id|tostring].name // $tt[$id|tostring].name), ($mm[$id|tostring].m // "-"), ($tt[$id|tostring].t // "-") ]
            | @tsv' movie.json tv.json | sort -t$'\t' -k3,3n

      - name: Count titles per provider
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          for id in 43 73 520 387 2100 613 2545 1956 1957 1964 464 538 2285 332 83 350 1899 1796 2303 2616 386 11 99 87 151 258 526 34 283 207 300 191 212 430 190 278 1718 1768 2129 260; do echo "$id" >> top.tsv; done
          echo "== subscription + free-with-ads titles per provider (US): movies / tv =="
          while read -r id; do
            [ -z "$id" ] && continue
            name=$(jq -r --argjson i $id '[.results[]|select(.provider_id==$i)][0].provider_name' movie.json tv.json | head -1)
            m=$(curl -sS -H "Authorization: Bearer $TMDB_TOKEN" "https://api.themoviedb.org/3/discover/movie?watch_region=US&with_watch_providers=$id&with_watch_monetization_types=flatrate%7Cads&vote_count.gte=30" | jq -r '.total_results // "err"')
            t=$(curl -sS -H "Authorization: Bearer $TMDB_TOKEN" "https://api.themoviedb.org/3/discover/tv?watch_region=US&with_watch_providers=$id&with_watch_monetization_types=flatrate%7Cads&vote_count.gte=30" | jq -r '.total_results // "err"')
            printf '%s\t%s\tmovies=%s\ttv=%s\n' "$id" "$name" "$m" "$t"
            sleep 0.1
          done < top.tsv
